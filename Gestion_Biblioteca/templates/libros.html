{% extends "base.html" %}

{% block titulo %}Libros{% endblock %}

{% block contenido %}
<div class="f1">
    <h1>Libros</h1>
    <form method="POST" action="{{ url_for('manejar_libros') }}" class="form-agregar-libro">
        <div class="form-group">
            <label for="titulo">Titulo</label>
            <input type="text" class="form-control" id="titulo" name="titulo" required>
        </div>
        <div class="form-group">
            <label for="autor">Autor</label>
            <input type="text" class="form-control" id="autor" name="autor" required>
        </div>
        <div class="form-group1">
            <label for="isbn">ISBN</label>
            <input type="text" class="form-control" id="isbn" name="isbn" required>
        </div>
        <div class="form-group">
            <label for="editorial">Editorial</label>
            <input type="text" class="form-control" id="editorial" name="editorial" required>
        </div>
        <div class="form-group">
            <label for="año_publicacion">Año de publicación</label>
            <input type="number" class="form-control" id="año_publicacion" name="año_publicacion" required>
        </div>
        <button type="submit" class="btn btn-primary">Agregar libro</button>
    </form>
    </div>

    <h2>Lista de libros</h2>
    <ul class="list-group">
        {% for libro in libros %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            {{ libro.titulo }} por {{ libro.autor }} (ISBN: {{ libro.isbn }})
            <form method="POST" action="{{ url_for('eliminar_libro', isbn=libro.isbn) }}" class="form-eliminar-libro" style="display: inline;">
                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás seguro de que deseas eliminar este libro?')">Eliminar</button>
            </form>
        </li>
        {% endfor %}
    </ul>

{% endblock %}
